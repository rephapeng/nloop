# Workspace onecookie — agent yang ngurusin app MarginIn + OneCookie.
#
# Ini isi config.yaml lama (pra-workspace) yang dipindah ke sini apa adanya.
# Yang tetap di config.yaml root cuma setelan level proses: server, loops,
# claude, paths, memory. Lihat engine/workspaces.py.
label: OneCookie
primary: true        # workspace default buat request tanpa ?workspace=,
                     # sekaligus yang mengadopsi run lama (pra-workspace)

# Reactive triggers: webhook Sentry/PostHog -> loop otomatis.
# URL: POST /api/hooks/{sentry|posthog|generic}?workspace=onecookie&project=<nama>&token=<token>
triggers:
  token: null              # WAJIB diisi string random kalau server-nya exposed
  sentry:
    resolve: true          # run sukses -> mark issue resolved (SENTRY_AUTH_TOKEN di .env)
    url: https://sentry.io
  projects:
    marginin:              # issue Sentry masuk -> repro -> fix -> push+deploy -> resolve
      workdir: /opt/marginin
      verify_cmd: "npm run build"     # health check project (repro script otomatis di depannya)
      repro: true                     # agent WAJIB tulis .nloop/repro/<issue>.sh dulu
      on_success_cmd: >-
        git add -A && git commit -m "fix: auto-fix Sentry issue (nloop)" &&
        git push origin main && docker compose up -d --build
      max_iterations: 8
      max_cost_usd: 5.0
    onecookie:             # toko kue — FastAPI + vanilla JS (lihat /opt/onecookie/CLAUDE.md)
      workdir: /opt/onecookie
      verify_cmd: "python3 -m py_compile app/main.py app/db.py && node --check public/js/store.js && node --check public/admin/admin.js"
      repro: true
      on_success_cmd: >-
        git add -A && git commit -m "fix: auto-fix Sentry issue (nloop)" &&
        git push origin main && docker compose up -d --build
      max_iterations: 8
      max_cost_usd: 5.0

# Watchdog Sentry: poll issue unresolved tiap interval -> spawn loop issue-fix.
watchdog:
  enabled: true
  interval: 1h             # default kalau project di bawah nggak override
  cooldown: 24h            # issue yang barusan dicoba (sukses/gagal) jangan diulang dulu
  max_per_tick: 1
  organization: marginin
  projects:                # tiap project poll SENDIRI-SENDIRI, interval bisa beda
    marginin:
      name: marginin        # <nama di triggers.projects>
      interval: 30m         # TODO: sesuaikan — placeholder, ganti sesuai kebutuhan
    onecookie:
      name: onecookie
      interval: 2h          # TODO: sesuaikan — placeholder, ganti sesuai kebutuhan

# Task registry — definisi kerjaan yang bisa dipanggil ULANG dengan payload beda.
# Bisa juga satu task per file di workspaces/onecookie/tasks/<id>.yaml.
tasks:
  promo-post:
    name: "Promo post MarginIn"
    description: >-
      Gimmick post promosi (twitter + threads) dijadwalin ke Buffer. Slot pagi
      terbit 07:30 WIB, sore 19:00 WIB (jam post diatur scripts/buffer_post.py).
    payload:
      required: [slot]     # pagi | sore
    goal: >-
      Bikin gimmick post promosi MarginIn buat slot {{slot}}: 1 post twitter +
      1 post threads, jadwalin ke Buffer pake
      /opt/nloop/.venv/bin/python3 /opt/nloop/scripts/buffer_post.py post
      --slot {{slot}}. Ikuti aturan konten di role.
    verify_cmd: ".venv/bin/python3 scripts/buffer_post.py verify --slot {{slot}}"
    workdir: /opt/nloop
    role: buffer-promo
    context_cmd: ".venv/bin/python3 scripts/buffer_post.py recent -n 10"
    max_iterations: 4
    max_cost_usd: 1.5
    idempotency_key: "promo:{{slot}}"   # 1 run aktif per slot, trigger dobel nggak numpuk

# Loop terjadwal. `at` = harian UTC, atau `every` = interval (30m/6h/1d). Steps
# jalan BERURUTAN; step berikut cuma jalan kalau sebelumnya succeeded, kecuali
# `always: true`. Step = `task:` + `payload:` ATAU goal+verify_cmd inline.
#
# promo-pagi/sore: task yang SAMA, payload beda — run nyala ~45 menit sebelum jam
# post biar agent sempet nulis. Token Buffer di .env (BUFFER_ACCESS_TOKEN).
schedules:
  promo-pagi:
    at: "23:45"            # UTC = 06:45 WIB -> post terbit 07:30 WIB
    steps:
      - task: promo-post
        payload: {slot: pagi}
  promo-sore:
    at: "11:15"            # UTC = 18:15 WIB -> post terbit 19:00 WIB
    steps:
      - task: promo-post
        payload: {slot: sore}

# Laporan traffic harian promo (Buffer -> PostHog attribution) -> Telegram.
# Deterministik (bukan loop claude) — cuma query PostHog + kirim teks, gratis.
promo_report:
  enabled: true
  at: "14:30"              # UTC = 21:30 WIB, abis slot sore & mayoritas hari udah lewat
  days: 7                  # window agregat/tren/breakdown (Hari ini & Kemarin selalu ada)
  send_on_start: true      # kirim sekali begitu nloop nyala, nggak nunggu jadwal besok

# Bot Telegram workspace ini. Karena `primary: true`, nama env var-nya tetap yang
# lama: TELEGRAM_BOT_TOKEN + TELEGRAM_ALLOWED_CHAT_IDS (di .env, chmod 600).
telegram:
  enabled: true
  notify: true             # broadcast run selesai ke semua chat allow-list
  agent_workdir: .         # cwd buat chat freeform -> session Claude Code
  model: null              # model chat substantif (null = default CLI)
  model_smalltalk: sonnet  # sapaan pendek -> tier murah (hemat subscription)
  thinking_tokens: 10000
  cmd_timeout_sec: 900
  max_turns: null          # null = tanpa batas turn buat chat (guardrail: timeout + auto-continue)
  progress_interval_sec: 60  # kirim update progres ke chat tiap N detik (0 = off)
  # role: agent            # roles/agent.md dipake sebagai persona chat
  # context_cmd: "..."     # grounding segar buat tiap pesan chat
