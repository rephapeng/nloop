<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nloop — run</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔁</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
  <script>document.documentElement.classList.add('motion');</script>
</head>
<body data-page="run" data-nav="runs">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="content">
    <header class="page-head reveal">
      <h1><a href="/" class="crumb-link">Runs</a> / <span id="crumb-task"></span>
        <code id="run-id"></code></h1>
      <span class="spacer"></span>
      <span id="status-badge"></span>
      <button id="stop" class="danger" style="display:none">Stop</button>
    </header>

    <section class="card run-head reveal">
      <p class="goal-big" id="goal">…</p>
      <div class="chips" id="chips"></div>
      <div class="gauges">
        <div class="gauge">
          <div class="lbl"><span>Iterations</span><b id="iter">–</b></div>
          <div class="bar" id="iter-bar"><i style="width:0%"></i></div>
        </div>
        <div class="gauge">
          <div class="lbl"><span>Budget</span><b id="cost">–</b></div>
          <div class="bar" id="cost-bar"><i style="width:0%"></i></div>
        </div>
      </div>
    </section>

    <h2 class="sect reveal">Trace</h2>
    <div class="trace-layout reveal">
      <div class="card waterfall-wrap">
        <div class="wf-head">
          <span>span</span><span>timeline</span><span class="num">duration</span>
        </div>
        <div id="waterfall"><div class="empty">loading…</div></div>
      </div>
      <aside class="card pad span-detail" id="span-detail">
        <div class="hint-box">Click a span to see its details.</div>
      </aside>
    </div>

    <h2 class="sect reveal">Log</h2>
    <div class="log-bar reveal" id="log-filter">
      <button class="pill on" data-filter="all">all</button>
      <button class="pill" data-filter="turn">turn</button>
      <button class="pill" data-filter="tool">tool</button>
      <button class="pill" data-filter="verify">verify / gate</button>
      <button class="pill" data-filter="warn">warnings</button>
    </div>
    <div class="log-wrap">
      <div id="live" class="card"></div>
      <button id="jump-live" class="jump-live" type="button" hidden>↓ latest</button>
    </div>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/run.js"></script>
</body>
</html>
