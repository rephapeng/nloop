<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nloop — runs</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔁</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
  <script>document.documentElement.classList.add('motion');</script>
</head>
<body data-page="index" data-nav="runs">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="content">
    <header class="page-head reveal">
      <h1>Runs<span class="count" id="count"></span></h1>
      <span class="spacer"></span>
      <button class="primary" id="toggle-form" type="button">＋ New loop</button>
    </header>

    <form id="new-loop" class="card" hidden>
      <div class="grid">
        <label class="field full">Goal
          <input name="goal" required placeholder="Fix all failing tests in this repo">
        </label>
        <label class="field">Verify command <span class="hint">— exit 0 = done</span>
          <input name="verify_cmd" required placeholder="pytest -q" class="mono">
        </label>
        <label class="field">Workdir <span class="hint">— blank = auto</span>
          <input name="workdir" placeholder="/path/to/repo" class="mono">
        </label>
      </div>
      <details class="advanced">
        <summary>Advanced — role, grounding, quality gate, limits</summary>
        <div class="grid">
          <label class="field">Role <span class="hint">— roles/&lt;name&gt;.md</span>
            <input name="role" placeholder="writer">
          </label>
          <label class="field">Model
            <input name="model" placeholder="default from config">
          </label>
          <label class="field">Max iterations
            <input name="max_iterations" type="number" min="1" placeholder="10">
          </label>
          <label class="field">Max cost (USD)
            <input name="max_cost_usd" type="number" step="0.5" min="0.5" placeholder="5.0">
          </label>
          <label class="field full">Context command <span class="hint">— fresh grounding every iteration</span>
            <input name="context_cmd" placeholder="python3 tools/build_knowledge.py --stdout" class="mono">
          </label>
          <label class="field full">Gate prompt <span class="hint">— quality-gate criteria applied after the verifier passes (blank = no gate)</span>
            <textarea name="gate_prompt" rows="2" placeholder="At least 1000 words, original, every internal link valid."></textarea>
          </label>
        </div>
      </details>
      <div class="form-actions">
        <button class="primary" type="submit">Run loop</button>
        <span id="form-error" class="form-error"></span>
      </div>
      <p class="faint form-note">Need something repeatable with different inputs?
        Define a task under <a href="/tasks">Tasks</a>.</p>
    </form>

    <div class="filters reveal" id="filters"></div>

    <div class="table-wrap card reveal">
      <table class="tbl">
        <thead>
          <tr>
            <th>Status</th><th>Run</th><th>Task</th><th class="num">Iterations</th>
            <th class="num">Cost</th><th class="num">Duration</th>
            <th class="num">Started</th><th></th>
          </tr>
        </thead>
        <tbody id="runs"><tr><td colspan="8"><div class="empty">loading…</div></td></tr></tbody>
      </table>
    </div>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/runs.js"></script>
</body>
</html>
